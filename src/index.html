<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <title>Bernardo Fernando — Portfólio</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Portfólio de Bernardo Fernando — Desenvolvedor Backend C# e ASP.NET Core" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap"
    rel="stylesheet" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('portfolio_theme');
        var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
